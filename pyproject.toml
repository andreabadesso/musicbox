[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musicbox"
version = "0.1.0"
description = "Event shaped HTTP API in front of Music Assistant"
requires-python = ">=3.11"
# Versions are deliberately unpinned. The only build that matters is the Nix
# one, where the versions are whatever the pinned nixpkgs has, and a range here
# would just give the runtime deps check something to fail on.
#
# music-assistant-client is NOT a dependency: the MA websocket client is hand
# rolled in musicbox/ma_client.py, because reconnect behaviour and message
# correlation are the two things this process most needs to own outright. That
# leaves aiohttp as the only transport dependency.
dependencies = [
  "fastapi",
  "uvicorn",
  "aiohttp",
  # The MCP server at /mcp and the musicbox-mcp stdio script. This is the
  # official SDK and it already ships FastMCP, so the separate `fastmcp`
  # package is NOT a dependency: adding it would put two implementations of
  # the same decorator in the closure.
  "mcp",
]
# NOT listed and deliberately: piper. Speech is rendered by running the piper
# EXECUTABLE, whose path arrives in MUSICBOX_PIPER_BIN, and the voice model is
# a file in MUSICBOX_PIPER_VOICE. piper-tts as a Python dependency would drag
# onnxruntime into this environment, and on aarch64 that is a source build on
# a box that has wedged itself compiling twice. The nix side pins the binary
# and the voice from an input that resolves in the binary cache. ffmpeg is the
# same kind of dependency and is already required by the mixer, which is what
# brings the rendered wav to 48000:16:2.

[project.optional-dependencies]
# numpy is in the TEST set as well as in mixer, and not marked optional in the
# suite, on purpose: tests/test_mixer.py must FAIL rather than skip when it is
# missing. A mixing test that quietly skips is a mixing test that is not run,
# and the arithmetic it covers is the difference between a sound effect and a
# burst of clipping noise in a room full of people.
test = ["pytest", "httpx", "numpy"]

# The mixer's own dependencies, kept out of the base install so that musicbox
# still starts on a machine with no sound card and no BLAS. app.py imports
# mixer_client (a unix socket and a shlex parser), never mixer, so the API
# process never needs either of these.
#
# Both are in the binary cache for aarch64-linux on the Pi (verified: 13
# paths, 27.80 MiB download, zero source builds). That matters more than it
# sounds: this box boots from an SD card and has wedged itself twice compiling
# things, so anything that is not cached is effectively not available.
mixer = ["numpy", "pyalsaaudio"]

[project.scripts]
musicbox-server = "musicbox.__main__:main"
# Stdio MCP server for clients that will not speak HTTP. It controls a musicbox
# over HTTP at MUSICBOX_URL; it does not start one.
musicbox-mcp = "musicbox.mcp_server:main"
# The mixer runs as its own process and its own systemd unit, so that a fault
# in the audio loop cannot take the HTTP API down with it and vice versa. Run
# it by hand against a file to hear what it does without touching the speaker:
#   musicbox-mixer --no-fifo --music song.wav --out /tmp/mix.wav \
#     --sfx-dir ./sfx --cache-dir /tmp/pcm --socket "" \
#     --fire airhorn@1 --fire airhorn@1.3 --duration 6
musicbox-mixer = "musicbox.mixer:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["musicbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
